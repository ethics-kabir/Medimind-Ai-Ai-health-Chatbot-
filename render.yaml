services:
  - type: web
    name: medimind-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: ENABLE_UNAUTHENTICATED_HISTORY
        value: "false"
      - key: MAX_REQUEST_BYTES
        value: "65536"
      - key: MEDIMIND_ADMIN_TOKEN
        sync: false
